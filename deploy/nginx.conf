# TRIAD 站点配置模板
# 用法: 将 triad.example.com 全部替换为你的域名, 放到 /etc/nginx/sites-available/triad
#       并软链到 sites-enabled。证书文件由 certbot 签发后自动匹配此路径。

server {
    listen 80;
    listen [::]:80;
    server_name triad.example.com;

    # Let's Encrypt ACME 验证目录 (certbot --webroot 使用)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余请求一律跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name triad.example.com;

    ssl_certificate     /etc/letsencrypt/live/triad.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/triad.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 8k;
    }
}
